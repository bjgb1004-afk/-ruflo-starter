name: 로또 판매점/당첨 데이터 자동 동기화

on:
  schedule:
    # 토요일 밤 9시 30분 KST = 12시 30분 UTC(토) - 추첨(오후 8시 35분) 직후 당첨번호를
    # 최대한 빨리 반영하기 위한 실행. 미러(smok95/lotto) 갱신이 늦어 이때 못 가져와도
    # 아래 매일 새벽 3시 실행이 안전망으로 다시 시도한다.
    - cron: '30 12 * * 6'
    # 매일 새벽 3시 KST = 18시 UTC(전날) - 토요일 실행이 실패했거나 미러 반영이
    # 늦어졌을 경우를 대비한 안전망. 평소엔 신규 회차가 없어 그냥 스킵된다.
    - cron: '0 18 * * *'

  # 수동 실행
  workflow_dispatch:
    inputs:
      skip_stores:
        description: '판매점 수집 건너뛰기'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_draws:
        description: '당첨 회차 수집 건너뛰기'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '24'
  WORKING_DIR: 'scripts/ingest'

jobs:
  sync-data:
    name: 데이터 동기화
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 저장소 클론
        uses: actions/checkout@v4

      - name: 🔧 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package.json'

      - name: 📦 의존성 설치
        run: |
          cd ${{ env.WORKING_DIR }}
          npm ci

      - name: ✅ 필수 환경 변수 확인
        run: |
          echo "🔐 Supabase 설정 확인..."
          [ -z "${{ secrets.SUPABASE_URL }}" ] && echo "❌ SUPABASE_URL 미설정" && exit 1
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && echo "❌ SUPABASE_SERVICE_ROLE_KEY 미설정" && exit 1
          
          echo "✅ Supabase OK"
          [ -z "${{ secrets.VWORLD_API_KEY }}" ] && echo "⚠️  V-World API 키 미설정 (권장)"
          
          echo "📊 설정 완료"

      - name: 🏪 판매점 데이터 수집
        if: ${{ github.event.inputs.skip_stores != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 1/3: 판매점 수집..."
          echo "ℹ️  현재 시드 데이터 또는 CSV 사용"
          npm run ingest:stores || echo "⚠️  판매점 수집 완료 (데이터 소스 구현 필요)"
          echo "✅ Step 1 완료"

      - name: 🎰 당첨 회차 및 배출점 수집
        if: ${{ github.event.inputs.skip_draws != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 2/3: 당첨 회차 및 배출점 수집..."
          npm run ingest:draws
          echo "✅ Step 2 완료"

      - name: 🏆 명당 랭킹 재계산
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 3/3: 랭킹 재계산..."
          npm run ingest:refresh-rankings
          echo "✅ Step 3 완료"

      - name: ✅ 성공
        if: success()
        run: |
          echo "🎉 데이터 동기화 완료!"
          echo "📊 완료 내역:"
          echo "  ✓ 판매점 수집"
          echo "  ✓ 당첨 회차/배출점 수집"
          echo "  ✓ 명당 랭킹 재계산"

      - name: ❌ 실패 알림
        if: failure()
        run: |
          echo "❌ 데이터 동기화 실패"
          echo ""
          echo "🔍 점검 사항:"
          echo "  1. Supabase 환경변수 (필수)"
          echo "  2. V-World API 키 (권장)"
          echo "  3. 판매점 데이터 소스 (필수)"
          echo ""
          echo "📚 설정 가이드:"
          echo "  - VWORLD_API_SETUP.md"
          echo "  - GITHUB_ACTIONS_SETUP.md"
          exit 1
