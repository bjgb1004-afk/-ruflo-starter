name: 로또 판매점/당첨 데이터 자동 동기화

on:
  schedule:
    # 추첨 방송은 토요일 오후 8시35분 KST. GitHub Actions의 scheduled cron은 "언젠가 대략
    # 그 시각에" 실행되는 게 아니라 통째로 스킵될 수 있다(공식 문서에 명시된 known behavior -
    # 특히 매시 정각 부근은 부하가 몰려 더 잘 스킵됨). 실측: 21시30분 단발 실행 1개가 통째로
    # 안 돈 날이 있었음(새벽 3시 안전망 cron은 정상 실행됨 - 즉 워크플로 자체 문제가 아니라
    # 특정 스케줄 1건이 스킵된 것). 단일 타이밍에 의존하지 않도록 추첨 후 21시~22시30분
    # 사이 15~30분 간격으로 여러 번 재시도한다 - draw_history upsert라 이미 반영된 회차는
    # 그냥 스킵되므로 여러 번 돌아도 안전하다(멱등).
    - cron: '0 12 * * 6'   # 21:00 KST
    - cron: '15 12 * * 6'  # 21:15 KST
    - cron: '30 12 * * 6'  # 21:30 KST
    - cron: '45 12 * * 6'  # 21:45 KST
    - cron: '0 13 * * 6'   # 22:00 KST
    - cron: '30 13 * * 6'  # 22:30 KST
    # 매일 새벽 3시 KST = 18시 UTC(전날) - 위 토요일 재시도가 전부 실패했거나 미러
    # 반영이 늦어졌을 경우를 대비한 최종 안전망. 평소엔 신규 회차가 없어 그냥 스킵된다.
    - cron: '0 18 * * *'

  # 수동 실행
  workflow_dispatch:
    inputs:
      skip_stores:
        description: '판매점 수집 건너뛰기'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_draws:
        description: '당첨 회차 수집 건너뛰기'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

env:
  NODE_VERSION: '24'
  WORKING_DIR: 'scripts/ingest'

jobs:
  sync-data:
    name: 데이터 동기화
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 저장소 클론
        uses: actions/checkout@v4

      - name: 🔧 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package.json'

      - name: 📦 의존성 설치
        run: |
          cd ${{ env.WORKING_DIR }}
          npm ci

      - name: ✅ 필수 환경 변수 확인
        run: |
          echo "🔐 Supabase 설정 확인..."
          [ -z "${{ secrets.SUPABASE_URL }}" ] && echo "❌ SUPABASE_URL 미설정" && exit 1
          [ -z "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ] && echo "❌ SUPABASE_SERVICE_ROLE_KEY 미설정" && exit 1
          
          echo "✅ Supabase OK"
          [ -z "${{ secrets.VWORLD_API_KEY }}" ] && echo "⚠️  V-World API 키 미설정 (권장)"
          
          echo "📊 설정 완료"

      - name: 🏪 판매점 데이터 수집
        if: ${{ github.event.inputs.skip_stores != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 1/3: 판매점 수집..."
          echo "ℹ️  현재 시드 데이터 또는 CSV 사용"
          npm run ingest:stores || echo "⚠️  판매점 수집 완료 (데이터 소스 구현 필요)"
          echo "✅ Step 1 완료"

      - name: 🎰 당첨 회차 및 배출점 수집
        if: ${{ github.event.inputs.skip_draws != 'true' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 2/3: 당첨 회차 및 배출점 수집..."
          npm run ingest:draws
          echo "✅ Step 2 완료"

      - name: 🏆 명당 랭킹 재계산
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd ${{ env.WORKING_DIR }}
          echo "📍 Step 3/3: 랭킹 재계산..."
          npm run ingest:refresh-rankings
          echo "✅ Step 3 완료"

      - name: ✅ 성공
        if: success()
        run: |
          echo "🎉 데이터 동기화 완료!"
          echo "📊 완료 내역:"
          echo "  ✓ 판매점 수집"
          echo "  ✓ 당첨 회차/배출점 수집"
          echo "  ✓ 명당 랭킹 재계산"

      - name: ❌ 실패 알림
        if: failure()
        run: |
          echo "❌ 데이터 동기화 실패"
          echo ""
          echo "🔍 점검 사항:"
          echo "  1. Supabase 환경변수 (필수)"
          echo "  2. V-World API 키 (권장)"
          echo "  3. 판매점 데이터 소스 (필수)"
          echo ""
          echo "📚 설정 가이드:"
          echo "  - VWORLD_API_SETUP.md"
          echo "  - GITHUB_ACTIONS_SETUP.md"
          exit 1
