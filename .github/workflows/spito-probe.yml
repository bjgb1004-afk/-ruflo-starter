# 스피또 발행내역 데이터 주소 탐색(일회성). 요청은 페이지 1건 + 스크립트 최대 8건뿐이다.
# 확인이 끝나면 이 파일과 scripts/ingest/probeSpito.mjs 는 지운다.
name: 스피또 주소 탐색

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 🔎 주소 탐색
        run: node scripts/ingest/probeSpito.mjs | tee probe.log
      - name: 결과를 요약에 남기기
        if: always()
        run: |
          { echo '```'; cat probe.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
