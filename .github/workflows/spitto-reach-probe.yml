# 일회성 진단: 깃허브 액션 러너에서 동행복권의 어느 문이 열려 있는지 본다.
#
# 왜 필요한가 (2026-10-23):
#   10/22 22:42 KST에는 이 러너에서 스피또 수집이 34건 성공했는데, 그 뒤 두 번(자동 06:14,
#   수동 21:55)은 "fetch failed" 한 줄만 남기고 실패했다. 집 와이파이에서는 같은 증상이
#   ConnectTimeout(연결 무응답)으로 확인됐지만, 러너에서의 실패가 같은 원인인지는 모른다.
#   한편 teams-jh/public-storage는 같은 호스트(www.dhlottery.co.kr)의 로또 경로를 1시간마다
#   긁고 있고 오늘 10:04 UTC에도 성공했다 -> 러너 대역 전체가 막힌 것은 아니다.
#
# 같은 실행 = 같은 아웃바운드 IP라는 점을 이용해, 세 주소를 한 번에 때려 비교한다:
#   전부 실패            -> 이 러너 IP가 동행복권에 못 붙는다 (IP 뽑기 문제)
#   로또만 성공          -> /st/ 경로만 막혔다 (헤더·호출방식으로 뚫을 여지)
#   전부 성공            -> 앞선 실패는 일시적이었다 (바로 수집하면 끝)
#
# curl의 종료코드가 원인을 구분해 준다: 6=DNS 실패, 7=연결 거부, 28=타임아웃(무응답),
# 0=연결 성공(HTTP 코드를 따로 본다). 호출은 전부 합쳐 3건이라 차단을 자극할 양이 아니다.
#
# 확인이 끝나면 이 파일을 지운다.
name: 스피또 접속 진단

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 아웃바운드 IP
        run: curl -s --max-time 10 https://api.ipify.org; echo ""

      - name: 1) 스피또 발행내역 API (우리가 쓰는 주소, 우리가 보내는 헤더 그대로)
        run: |
          curl -sS -o /tmp/spitto.txt -D /tmp/spitto.head \
            -w "HTTP:%{http_code} 걸린시간:%{time_total}s\n" --max-time 30 \
            -H "User-Agent: Mozilla/5.0 (compatible; LottoMapEnrichBot/1.0; +personal-project)" \
            -H "Referer: https://www.dhlottery.co.kr/st/pblcnDsctn?stGmTypeCd=st1000" \
            -H "Accept: application/json, text/javascript, */*; q=0.01" \
            -H "X-Requested-With: XMLHttpRequest" \
            "https://www.dhlottery.co.kr/st/selectPblcnDsctn.do?gdsType=&gdsPrice=&gdsStatus=&pageNum=1&recordCountPerPage=50" \
            || echo "curl 종료코드: $?"
          echo "--- 응답 앞부분 ---"; head -c 300 /tmp/spitto.txt || true
        continue-on-error: true

      - name: 2) 로또 당첨번호 API (남의 저장소가 오늘도 성공한 주소 = 대조군)
        run: |
          curl -sS -o /tmp/lotto.txt \
            -w "HTTP:%{http_code} 걸린시간:%{time_total}s\n" --max-time 30 \
            -H "User-Agent: public-storage-lotto-updater/1.0 (+https://github.com/teams-jh/public-storage)" \
            "https://www.dhlottery.co.kr/lt645/selectPstLt645InfoNew.do?srchDir=latest&srchCursorLtEpsd=1240" \
            || echo "curl 종료코드: $?"
          echo "--- 응답 앞부분 ---"; head -c 300 /tmp/lotto.txt || true
        continue-on-error: true

      - name: 3) 동행복권 메인 (호스트 자체에 붙는지)
        run: |
          curl -sS -o /dev/null \
            -w "HTTP:%{http_code} 걸린시간:%{time_total}s\n" --max-time 30 \
            -H "User-Agent: Mozilla/5.0" \
            "https://www.dhlottery.co.kr/" \
            || echo "curl 종료코드: $?"
        continue-on-error: true

      # curl이 되는데 스크립트가 실패하면 원인은 네트워크가 아니라 Node 쪽(fetch 기본
      # 연결제한 10초, TLS 협상 등)이다. 같은 러너·같은 IP에서 돌려 그 둘을 가른다.
      - name: 저장소 클론 (아래 수집 스텝에만 필요)
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'scripts/ingest/package.json'

      # curl 200 / Node ConnectTimeout이 같은 IP에서 동시에 나왔다. 어느 층에서 갈리는지
      # (주소 계열 선택인지, fetch 구현인지) 네 변형을 한 실행에서 비교한다.
      - name: 4) Node 연결 방식별 비교
        run: node scripts/ingest/_probeNodeReach.mjs
        continue-on-error: true

      - name: 5) 실제 수집 스크립트 (Node fetch로도 되는지)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts/ingest
          npm ci
          npm run ingest:spitto
        continue-on-error: true
