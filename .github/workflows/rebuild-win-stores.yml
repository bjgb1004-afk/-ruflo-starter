# 과거 회차 배출점을 동행복권 공식 경로로 재수집한다. 한 번 눌러두면 끝까지 간다.
#
# 왜 20회차씩 나눠서 러너를 바꿔 가며 도는가: 공식 서버가 연속 요청을 IP째 끊는다. TCP
# connect 단계에서 드랍되고(UND_ERR_CONNECT_TIMEOUT) curl도 같이 죽으니 Node 문제가 아니다.
# 2026-09-28 실측으로 로컬은 48회차, Actions 러너는 31회차 만에 막혔고, 간격을 0.12초에서
# 1초로 늘렸더니 오히려 더 빨리 막혔다 - 간격이 아니라 한 IP가 쓸 수 있는 누적 요청량에
# 걸린다. 그래서 job 하나가 20회차만(임계치 31보다 넉넉히 아래) 돌고 끝내고, 다음 job이
# 새 러너(=새 IP)에서 이어받는다. 어디까지 했는지는 Supabase rebuild_progress 한 행에 남는다.
#
# cron을 쓰지 않는 이유: 이 저장소에서 GitHub schedule이 통째로 스킵되는 걸 여러 번 실측했다
# (sync-data.yml 주석 참고). 2026-09-28에도 30분 cron이 두 번 연속 안 떴다. 그래서 스케줄
# 대신 matrix job을 줄세워서 한 번의 실행 안에서 끝낸다.
#
# 막힌 job은 진행 포인터를 옮기지 않으므로 다음 job이 같은 구간을 새 IP로 다시 한다 -
# 빠지는 회차가 없다. 다 끝난 뒤의 job들은 "더 돌 게 없다"만 찍고 바로 끝난다.
#
# Actions 사용량: 이 저장소는 Public이라 무료 분이 무제한이다. (Private였다면 job당 약 2분
# × 50개 = 100분이라, 월 2,000분 무료 한도로 20번 실행할 수 있는 양이다.)
name: 배출점 공식 재수집

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: '몇 조각까지 돌지 (20회차 × N)'
        required: false
        default: '50'
        type: string
      chunk:
        description: '한 조각에 돌 회차 수'
        required: false
        default: '20'
        type: string
      delay_ms:
        description: '회차 간 간격(ms)'
        required: false
        default: '1500'
        type: string
      dry_run:
        description: '미리보기만 (쓰기 없음)'
        required: false
        default: 'false'
        type: choice
        options: ['true', 'false']

# 두 번 눌러도 겹쳐 돌지 않게 - 진행 포인터가 꼬이면 안 된다.
concurrency:
  group: rebuild-win-stores
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  WORKING_DIR: 'scripts/ingest'

jobs:
  plan:
    name: 조각 나누기
    runs-on: ubuntu-latest
    outputs:
      rounds: ${{ steps.mk.outputs.rounds }}
    steps:
      - id: mk
        run: echo "rounds=$(seq 1 ${{ inputs.rounds || '50' }} | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  rebuild:
    name: 재수집 ${{ matrix.round }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # 한 줄로 세운다. 동시에 돌리면 같은 구간을 두 job이 겹쳐 처리한다.
      max-parallel: 1
      # 한 조각이 막혀도 나머지는 계속 간다 - 다음 조각이 새 IP로 다시 시도한다.
      fail-fast: false
      matrix:
        round: ${{ fromJson(needs.plan.outputs.rounds) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package.json'

      - name: 📦 의존성 설치
        run: cd ${{ env.WORKING_DIR }} && npm ci

      - name: 🔁 재수집 (20회차)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '0' }}
          REQUEST_DELAY_MS: ${{ inputs.delay_ms || '1500' }}
        # 감소 회차도 반영한다. 감소는 데이터 손실이 아니라, 폐업/상호변경으로 사라진
        # 가게의 1등이 옛 파이프라인에서 1km쯤 떨어진 엉뚱한 옆 가게에 잘못 붙어 있던 걸
        # 지우는 것이다(2026-09-28 321/972/1070회로 확인). "없어진 가게는 뺀다"가 방침이다.
        run: |
          cd ${{ env.WORKING_DIR }}
          npm run ingest:rebuild-winstores -- --allow-shrink --chunk=${{ inputs.chunk || '20' }}

  finish:
    name: 명당 랭킹 재계산
    needs: rebuild
    if: ${{ always() && inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '${{ env.WORKING_DIR }}/package.json'

      - name: 📦 의존성 설치
        run: cd ${{ env.WORKING_DIR }} && npm ci

      # 배출점이 바뀌면 명당 랭킹이 옛 누적값 위에 남으므로 다시 계산한다. 중간까지만
      # 진행됐어도 지금 상태 기준으로 다시 계산하는 게 맞다.
      - name: 🏆 랭킹 재계산
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: cd ${{ env.WORKING_DIR }} && npm run ingest:refresh-rankings
